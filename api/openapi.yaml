openapi: 3.1.0
info:
  title: vkr-checker API
  version: "1.0.0"
  description: >
    Контракт MVP vkr-checker. Источник истины для backend, frontend и QA (schemathesis).
    Человекочитаемое описание — API_CONTRACT.md. Модели отчёта — ARCHITECTURE_CHECKS.md §1, §7, §8.
servers:
  - url: http://127.0.0.1:8000
    description: local (по умолчанию)
tags:
  - name: service
  - name: auth
  - name: check
  - name: export
security:
  - session: []
  - bearer: []
  - {}
paths:
  /api/health:
    get:
      tags: [service]
      operationId: getHealth
      security: [{}]
      summary: Состояние сервиса, режим, доступность вёрстки, лимиты
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/session:
    post:
      tags: [auth]
      operationId: createSession
      security: [{}]
      summary: Вход по общему паролю (server-режим). В local-режиме всегда 204 без cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204":
          description: Успех. В server-режиме ставится cookie vkr_session (HttpOnly, SameSite=Strict, Secure).
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [auth]
      operationId: deleteSession
      security: [{}]
      summary: Выход (стирает cookie). Идемпотентно.
      responses:
        "204": { description: OK }
  /api/check:
    post:
      tags: [check]
      operationId: checkDocument
      summary: Проверка одной работы (.docx) → CheckReport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: ".docx, ≤ max_upload_mb" }
      responses:
        "200":
          description: Отчёт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFormat" }
        "422": { $ref: "#/components/responses/InvalidDocx" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/compare:
    post:
      tags: [check]
      operationId: compareVersions
      summary: Сравнение двух версий → CompareReport (включает полный CheckReport новой версии)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [old, new]
              properties:
                old: { type: string, format: binary }
                new: { type: string, format: binary }
      responses:
        "200":
          description: Отчёт сравнения
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompareReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFormat" }
        "422": { $ref: "#/components/responses/InvalidDocx" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/export/matrix.xlsx:
    post:
      tags: [export]
      operationId: exportMatrixXlsx
      summary: Построить .xlsx матрицы из присланного JSON (сервер ничего не хранит)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatrixExportRequest" }
      responses:
        "200":
          description: Файл .xlsx (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/export/report.docx:
    post:
      tags: [export]
      operationId: exportReportDocx
      summary: Построить .docx отчёта о проверке или о сравнении из присланного JSON (сервер ничего не хранит)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportExportRequest" }
      responses:
        "200":
          description: Файл .docx (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: vkr_session }
    bearer: { type: http, scheme: bearer, description: "Bearer <VKR_PASSWORD> — для скриптов и QA" }

  responses:
    BadRequest: { description: "bad_request / missing_file", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    Unauthorized: { description: "auth_required / invalid_password", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    PayloadTooLarge: { description: file_too_large, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    UnsupportedFormat: { description: unsupported_format, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    InvalidDocx: { description: "invalid_docx / docx_limits_exceeded", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    ValidationError: { description: validation_error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    TooManyRequests:
      description: too_many_attempts
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    InternalError: { description: internal_error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    Unavailable:
      description: "server_busy / processing_timeout"
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    # ---------- service / auth / errors ----------
    Health:
      type: object
      required: [status, service_version, mode, auth_required, layout_available, limits]
      properties:
        status: { const: ok }
        service_version: { type: string }
        mode: { enum: [local, server] }
        auth_required: { type: boolean }
        authenticated: { type: boolean, description: "валидна ли cookie/Bearer текущего запроса" }
        layout_available: { type: boolean }
        layout_engine: { type: [string, "null"] }
        limits:
          type: object
          required: [max_upload_mb, check_timeout_s, compare_timeout_s]
          properties:
            max_upload_mb: { type: integer }
            check_timeout_s: { type: integer }
            compare_timeout_s: { type: integer }
    LoginRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              enum: [bad_request, missing_file, auth_required, invalid_password, file_too_large,
                     unsupported_format, invalid_docx, docx_limits_exceeded, validation_error,
                     too_many_attempts, server_busy, processing_timeout, internal_error]
            message: { type: string, description: "по-русски, без трассировки и содержимого работы" }
            field: { type: [string, "null"], description: "old | new | file | путь в JSON" }
            request_id: { type: string }

    # ---------- общие ----------
    Level: { enum: [violation, suspicion, not_checked] }
    Outcome: { enum: [passed, findings, not_run, not_checked] }
    Method: { enum: [style, regex, morph, fuzzy, layout, estimate, count] }
    BlockId:
      enum: [structure, intro, volume, tables, numbering, consistency, methods, hypothesis,
             wording, tasks, not_checked, diff_impact]
    RuleId: { type: string, pattern: "^[A-Z]{2,4}-\\d{2}(\\.\\d+)?$" }
    FileInfo:
      type: object
      required: [name, size_bytes, sha256]
      properties:
        name: { type: string, maxLength: 200, description: "только имя, без пути" }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    TableRef:
      type: object
      required: [number_label, table_idx]
      properties:
        number_label: { type: string }
        table_idx: { type: integer, minimum: 1 }
        row: { type: [integer, "null"], minimum: 1 }
        col: { type: [integer, "null"], minimum: 1 }
    Location:
      type: object
      required: [section_path, quote]
      properties:
        section_path: { type: array, items: { type: string } }
        paragraph_idx: { type: [integer, "null"], minimum: 1 }
        table: { oneOf: [ { $ref: "#/components/schemas/TableRef" }, { type: "null" } ] }
        quote: { type: string }
        highlight:
          oneOf:
            - { type: array, items: { type: integer, minimum: 0 }, minItems: 2, maxItems: 2 }
            - { type: "null" }
        page: { type: [integer, "null"], minimum: 1, description: "по вёрстке LibreOffice; расширение SPEC §3.3" }
    Finding:
      type: object
      required: [id, rule_id, title, block, level, not_run, source, message, values, locations, count, method, fingerprint, origin]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{12}$" }
        rule_id: { $ref: "#/components/schemas/RuleId" }
        title: { type: string }
        block: { $ref: "#/components/schemas/BlockId" }
        level: { $ref: "#/components/schemas/Level" }
        not_run: { type: boolean }
        source:
          type: object
          required: [doc, section]
          properties:
            doc: { enum: [M, CH] }
            section: { type: string }
        message: { type: string }
        values: { type: object, additionalProperties: true }
        locations: { type: array, items: { $ref: "#/components/schemas/Location" } }
        count: { type: integer, minimum: 1 }
        hint: { type: [string, "null"] }
        method: { $ref: "#/components/schemas/Method" }
        fingerprint: { type: string }
        origin: { type: string, pattern: "^(rules|model:[a-z0-9_.-]+)$" }
    RuleResult:
      type: object
      required: [rule_id, title, block, outcome, findings, artifacts]
      properties:
        rule_id: { $ref: "#/components/schemas/RuleId" }
        title: { type: string }
        block: { $ref: "#/components/schemas/BlockId" }
        outcome: { $ref: "#/components/schemas/Outcome" }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        artifacts: { type: object, additionalProperties: true }
        skipped_reason: { type: [string, "null"] }

    # ---------- CheckReport ----------
    LayoutInfo:
      type: object
      required: [status, disclaimer]
      properties:
        status: { enum: [ok, partial, failed] }
        engine: { type: [string, "null"] }
        page_count: { type: [integer, "null"] }
        coverage: { type: [number, "null"], minimum: 0, maximum: 1 }
        reason: { type: [string, "null"] }
        font_substitutions: { type: array, items: { type: string } }
        disclaimer: { type: string }
    VolumeInfo:
      type: object
      required: [method, by_section]
      properties:
        method: { enum: [layout, estimate] }
        pages_main: { type: [number, "null"] }
        by_section:
          type: array
          items:
            type: object
            required: [title, pages]
            properties: { title: { type: string }, pages: { type: number } }
        estimate_formula: { type: [string, "null"] }
    StructureNode:
      type: object
      required: [title, kind, detection, confidence, children]
      properties:
        title: { type: string }
        kind: { enum: [TITLE, TOC, INTRO, CHAPTER, SUBSECTION, CHAPTER_CONCLUSIONS, CONCLUSION, BIBLIOGRAPHY, APPENDIX, UNKNOWN] }
        number: { type: [string, "null"] }
        detection: { enum: [style, pattern, heuristic] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        paragraph_idx: { type: [integer, "null"] }
        children: { type: array, items: { $ref: "#/components/schemas/StructureNode" } }
    Summary:
      type: object
      required: [violation, suspicion, not_checked, not_run, passed_rules]
      properties:
        violation: { type: integer, minimum: 0 }
        suspicion: { type: integer, minimum: 0 }
        not_checked: { type: integer, minimum: 0 }
        not_run: { type: integer, minimum: 0 }
        passed_rules: { type: array, items: { $ref: "#/components/schemas/RuleId" } }
        noise_warning: { type: [string, "null"] }
    ReportBlock:
      type: object
      required: [id, title, rule_results]
      properties:
        id: { $ref: "#/components/schemas/BlockId" }
        title: { type: string }
        rule_results: { type: array, items: { $ref: "#/components/schemas/RuleResult" } }
    NcItem:
      type: object
      required: [id, title, source]
      properties:
        id: { type: string, pattern: "^NC-01\\.\\d+$" }
        title: { type: string }
        source: { type: string }
        hint: { type: [string, "null"] }
        helper: { type: [string, "null"], description: "numbers_index | matrix | rule:<ID>" }
    MatrixCell:
      type: object
      required: [status, text, candidates, locations]
      properties:
        status: { enum: [auto, gap, n/a] }
        text: { type: string }
        candidates: { type: array, maxItems: 3, items: { type: string } }
        locations: { type: array, items: { $ref: "#/components/schemas/Location" } }
    MatrixRow:
      type: object
      required: [kind, label, statement, is_theoretical, cells]
      properties:
        kind: { enum: [hypothesis_part, defense_position, task] }
        label: { type: string }
        statement: { type: string }
        statement_loc: { oneOf: [ { $ref: "#/components/schemas/Location" }, { type: "null" } ] }
        is_theoretical: { type: boolean }
        cells:
          type: object
          required: [theory, instrument, calculation, result, conclusion]
          properties:
            theory: { $ref: "#/components/schemas/MatrixCell" }
            instrument: { $ref: "#/components/schemas/MatrixCell" }
            calculation: { $ref: "#/components/schemas/MatrixCell" }
            result: { $ref: "#/components/schemas/MatrixCell" }
            conclusion: { $ref: "#/components/schemas/MatrixCell" }
    Matrix:
      type: object
      required: [rows, stats]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/MatrixRow" } }
        stats:
          type: object
          required: [rows, gaps, auto_cells, warnings]
          properties:
            rows: { type: integer }
            gaps: { type: integer }
            auto_cells: { type: integer }
            warnings: { type: array, items: { type: string } }
    CheckReport:
      type: object
      required: [schema_version, service_version, checked_at, file, layout, volume, structure, summary, blocks, not_checked, matrix, warnings]
      properties:
        schema_version: { const: "1.0" }
        service_version: { type: string }
        checked_at: { type: string, format: date-time }
        file: { $ref: "#/components/schemas/FileInfo" }
        layout: { $ref: "#/components/schemas/LayoutInfo" }
        volume: { $ref: "#/components/schemas/VolumeInfo" }
        structure: { type: array, items: { $ref: "#/components/schemas/StructureNode" } }
        summary: { $ref: "#/components/schemas/Summary" }
        blocks: { type: array, items: { $ref: "#/components/schemas/ReportBlock" } }
        not_checked: { type: array, items: { $ref: "#/components/schemas/NcItem" } }
        matrix: { $ref: "#/components/schemas/Matrix" }
        warnings: { type: array, items: { type: string } }

    # ---------- CompareReport ----------
    Segment:
      type: object
      required: [op, text]
      properties:
        op: { enum: [equal, ins, del] }
        text: { type: string }
    ParagraphDiff:
      type: object
      required: [status]
      properties:
        status: { enum: [unchanged, modified, inserted, deleted, moved_out, moved_in] }
        old_idx: { type: [integer, "null"] }
        new_idx: { type: [integer, "null"] }
        text: { type: [string, "null"], description: "для inserted/deleted/unchanged" }
        segments: { type: array, items: { $ref: "#/components/schemas/Segment" } }
        move_id: { type: [string, "null"] }
    SectionDiff:
      type: object
      required: [status, paragraphs]
      properties:
        status: { enum: [unchanged, modified, renamed, added, removed] }
        rename_basis: { enum: [title, content, null] }
        old_title: { type: [string, "null"] }
        new_title: { type: [string, "null"] }
        paragraphs: { type: array, items: { $ref: "#/components/schemas/ParagraphDiff" } }
    Move:
      type: object
      required: [id, from_section, to_section, old_idx, new_idx, segments]
      properties:
        id: { type: string }
        from_section: { type: string }
        to_section: { type: string }
        old_idx: { type: array, items: { type: integer } }
        new_idx: { type: array, items: { type: integer } }
        segments: { type: array, items: { $ref: "#/components/schemas/Segment" } }
    NumberChange:
      type: object
      required: [old, new, context]
      properties:
        old: { type: string }
        new: { type: string }
        kind: { type: [string, "null"] }
        context: { type: string }
        loc_old: { oneOf: [ { $ref: "#/components/schemas/Location" }, { type: "null" } ] }
        loc_new: { oneOf: [ { $ref: "#/components/schemas/Location" }, { type: "null" } ] }
    CellChange:
      type: object
      required: [col, old, new]
      properties:
        col: { type: integer, minimum: 1 }
        old: { type: string }
        new: { type: string }
    RowChange:
      type: object
      required: [status]
      properties:
        status: { enum: [added, removed, modified] }
        old_row: { type: [integer, "null"] }
        new_row: { type: [integer, "null"] }
        cells: { type: array, items: { $ref: "#/components/schemas/CellChange" } }
    ObjectDiff:
      description: Таблица или рисунок; у рисунков rows всегда пуст
      type: object
      required: [status, flags, rows]
      properties:
        status: { enum: [unchanged, modified, added, removed] }
        flags: { type: array, items: { enum: [renumbered, retitled] } }
        old_label: { type: [string, "null"] }
        new_label: { type: [string, "null"] }
        rows: { type: array, items: { $ref: "#/components/schemas/RowChange" } }
    DynamicsItem:
      type: object
      required: [fingerprint, rule_id, title, message]
      properties:
        fingerprint: { type: string }
        rule_id: { $ref: "#/components/schemas/RuleId" }
        title: { type: string }
        message: { type: string }
        count_old: { type: [integer, "null"] }
        count_new: { type: [integer, "null"] }
        trend: { enum: [less, more, same, null] }
    DiffReport:
      type: object
      required: [sections, moves, number_changes, tables, figures, impact, dynamics]
      properties:
        sections: { type: array, items: { $ref: "#/components/schemas/SectionDiff" } }
        moves: { type: array, items: { $ref: "#/components/schemas/Move" } }
        number_changes: { type: array, items: { $ref: "#/components/schemas/NumberChange" } }
        tables: { type: array, items: { $ref: "#/components/schemas/ObjectDiff" } }
        figures: { type: array, items: { $ref: "#/components/schemas/ObjectDiff" } }
        impact: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        dynamics:
          type: object
          required: [fixed, new, remaining]
          properties:
            fixed: { type: array, items: { $ref: "#/components/schemas/DynamicsItem" } }
            new: { type: array, items: { $ref: "#/components/schemas/DynamicsItem" } }
            remaining: { type: array, items: { $ref: "#/components/schemas/DynamicsItem" } }
    CompareReport:
      type: object
      required: [schema_version, service_version, checked_at, old, new, diff]
      properties:
        schema_version: { const: "1.0" }
        service_version: { type: string }
        checked_at: { type: string, format: date-time }
        old:
          type: object
          required: [file, layout, summary]
          properties:
            file: { $ref: "#/components/schemas/FileInfo" }
            layout: { $ref: "#/components/schemas/LayoutInfo" }
            summary: { $ref: "#/components/schemas/Summary" }
        new: { $ref: "#/components/schemas/CheckReport" }
        diff: { $ref: "#/components/schemas/DiffReport" }

    # ---------- export ----------
    MatrixExportRequest:
      type: object
      required: [file_name, matrix]
      properties:
        file_name: { type: string, maxLength: 200, description: "имя проверенного файла (для заголовка листа и имени .xlsx)" }
        service_version: { type: string }
        checked_at: { type: string, format: date-time }
        matrix: { $ref: "#/components/schemas/Matrix" }
    ReportExportRequest:
      type: object
      description: "Ровно одно из полей: check (отчёт о проверке) или compare (отчёт о сравнении)."
      properties:
        check: { $ref: "#/components/schemas/CheckReport" }
        compare: { $ref: "#/components/schemas/CompareReport" }
