# nginx: psy-ign.ru -> vkr-checker (docker, 127.0.0.1:8010).
# Файл кладётся в /etc/nginx/sites-available/ и включается симлинком в sites-enabled.
# HTTPS-блок (listen 443, сертификаты) добавляет certbot --nginx.

# Ограничение частоты: проверка нагружает LibreOffice, публичный сайт без пароля.
limit_req_zone $binary_remote_addr zone=vkr_api:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name psy-ign.ru www.psy-ign.ru;

    # сравнение = два файла по 20 МБ + запас; экспорт отчёта сравнения — до 20 МБ JSON
    client_max_body_size 45m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location ~ ^/api/(check|compare)$ {
        limit_req zone=vkr_api burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # таймауты сервиса: проверка до 90 с, сравнение до 150 с
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
