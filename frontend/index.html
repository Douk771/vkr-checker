<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка ВКР</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/viewer.css">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">Проверка ВКР</h1>
    <p class="topbar__meta" id="engine-info" hidden></p>
  </header>

  <div class="banner banner--warn" id="layout-banner" role="status" hidden></div>
  <div class="banner banner--error" id="startup-error" role="alert" hidden>
    <span id="startup-error-text"></span>
    <button type="button" class="btn btn--ghost" id="startup-retry">Повторить</button>
  </div>

  <main class="page">
    <p class="muted" id="loading" role="status">Подключение к сервису…</p>

    <section class="panel" id="login-panel" aria-labelledby="login-title" hidden>
      <h2 id="login-title">Вход</h2>
      <form id="login-form" class="form" novalidate>
        <label class="field" for="password">Пароль</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="current-password" maxlength="256" required>
        <p class="form__error" id="login-error" role="alert" hidden></p>
        <button type="submit" class="btn btn--primary" id="login-submit">Войти</button>
      </form>
    </section>

    <section id="workspace" aria-label="Рабочая область" hidden>
      <p class="muted" id="limits-info"></p>
      <div class="modes" role="radiogroup" aria-label="Режим">
        <label class="mode"><input type="radio" name="mode" value="check" checked> Проверка</label>
        <label class="mode"><input type="radio" name="mode" value="compare"> Сравнение версий</label>
      </div>
      <form id="upload-form" class="upload" novalidate>
        <div class="drop" data-slot="file">
          <label class="field" for="file-file" id="label-file">Файл .docx</label>
          <input class="input" id="file-file" type="file" accept=".docx">
          <p class="muted drop__hint">Или перетащите файл сюда</p>
          <p class="form__error" data-error="file" role="alert" hidden></p>
        </div>
        <div class="drop" data-slot="old" hidden>
          <label class="field" for="file-old">Старая версия .docx</label>
          <input class="input" id="file-old" type="file" accept=".docx">
          <p class="muted drop__hint">Или перетащите файл сюда</p>
          <p class="form__error" data-error="old" role="alert" hidden></p>
        </div>
        <div class="drop" data-slot="new" hidden>
          <label class="field" for="file-new">Новая версия .docx</label>
          <input class="input" id="file-new" type="file" accept=".docx">
          <p class="muted drop__hint">Или перетащите файл сюда</p>
          <p class="form__error" data-error="new" role="alert" hidden></p>
        </div>
        <div class="upload__actions">
          <button type="submit" class="btn btn--primary" id="run-btn">Проверить</button>
          <button type="button" class="btn btn--ghost" id="cancel-btn" hidden>Отменить</button>
        </div>
      </form>
      <p class="muted" id="progress" role="status" hidden></p>
      <p class="form__error" id="run-error" role="alert" hidden></p>
      <section id="result" aria-label="Результат" hidden>
        <div class="result__bar">
          <button type="button" class="btn btn--ghost" id="download-btn">Скачать отчёт .html</button>
          <button type="button" class="btn btn--ghost" id="download-docx-btn">Скачать отчёт .docx (Word)</button>
          <span class="muted" id="download-status" role="status"></span>
        </div>
        <div id="cmp-root" hidden></div>
        <div id="rv-root"></div>
      </section>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
