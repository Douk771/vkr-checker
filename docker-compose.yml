# Локальный запуск: docker compose up  ->  http://127.0.0.1:8000
# Порт опубликован только на loopback хоста. Файлы работ нигде не сохраняются:
# корневая ФС read-only, /tmp - tmpfs (в памяти).
services:
  vkr-checker:
    build: .
    image: vkr-checker:local
    ports:
      - "127.0.0.1:${VKR_HOST_PORT:-8000}:8000"
    environment:
      VKR_MODE: ${VKR_MODE:-local}
      VKR_PASSWORD: ${VKR_PASSWORD:-}
      VKR_LOG_LEVEL: ${VKR_LOG_LEVEL:-INFO}
      VKR_MAX_UPLOAD_MB: ${VKR_MAX_UPLOAD_MB:-20}
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
